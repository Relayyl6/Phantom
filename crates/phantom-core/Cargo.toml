[package]
name    = "phantom-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace      = true
serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true
thiserror.workspace  = true
tracing.workspace    = true
chrono.workspace     = true
uuid.workspace       = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Cross-platform capture abstraction crates
xcap = "0.1"        # Screen capture
cpal = "0.15"       # Audio capture (WASAPI / CoreAudio)
rdev = "0.5"        # Global input hooks
nokhwa = "0.10"     # Webcam capture
extism = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["MediaDevices", "Navigator", "MediaStream", "MediaRecorder", "Window"] }
js-sys = "0.3"
