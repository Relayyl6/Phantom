[package]
name    = "phantom-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
tokio.workspace           = true
anyhow.workspace          = true
tracing.workspace         = true
tracing-subscriber.workspace = true
serde.workspace           = true
serde_json.workspace      = true
uuid.workspace            = true

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Secure credentials
keyring = "2"

# Internal
phantom-core    = { workspace = true }
phantom-ai      = { workspace = true }
phantom-storage = { workspace = true }
phantom-uplink  = { workspace = true }
phantom-billing = { workspace = true }
phantom-ui      = { workspace = true }
eframe          = "0.29"
