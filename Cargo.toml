[workspace]
resolver = "2"
members = [
    "crates/phantom-core",
    "crates/phantom-ai",
    "crates/phantom-voice",
    "crates/phantom-storage",
    "crates/phantom-billing",
    "crates/phantom-uplink",
    "crates/phantom-ui",
    "crates/phantom-cli",
]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
authors     = ["Phantom Team"]
license     = "MIT"
repository  = "https://github.com/yourname/phantom"

# ─── Shared dependency versions ─────────────────────────────────────────────
[workspace.dependencies]
# Async
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"

# Serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"

# Error handling
anyhow         = "1"
thiserror      = "1"

# HTTP / API
reqwest        = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"], default-features = false }
eventsource-stream = "0.2"

# Logging
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / paths
directories    = "5"

# Crypto / hashing
sha2           = "0.10"
hex            = "0.4"

# Semver (updater)
semver         = "1"

# UUID
uuid           = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono         = { version = "0.4", features = ["serde"] }

# Internal crates
phantom-core    = { path = "crates/phantom-core" }
phantom-ai      = { path = "crates/phantom-ai" }
phantom-voice   = { path = "crates/phantom-voice" }
phantom-storage = { path = "crates/phantom-storage" }
phantom-billing = { path = "crates/phantom-billing" }
phantom-uplink  = { path = "crates/phantom-uplink" }
phantom-ui      = { path = "crates/phantom-ui" }

[profile.release]
opt-level = 3
strip = true